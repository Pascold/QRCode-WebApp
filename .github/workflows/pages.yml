# Builds the static version of the app and publishes it on GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: PHP version
        run: php -v

      - name: Check translations
        run: php tools/check-translations.php

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Build static site
        # Project sites are served from /<repository-name>/.
        run: php tools/build-static.php --out=dist --base="/${{ github.event.repository.name }}/"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
