name: Translation
description: Fix a translation or ask for a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. pt-BR, sr-Latn, de-CH
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Quote the current text and your suggestion. Pull requests editing lang/<code>.php directly are even better.
    validations:
      required: true
