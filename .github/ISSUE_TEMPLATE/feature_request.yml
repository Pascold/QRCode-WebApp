name: Feature request
description: Suggest an idea or a new content type
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case - what are you trying to make a QR code for?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: markdown
    attributes:
      value: The app keeps everything in the browser and loads nothing from third parties - ideas that need a server or an external service are unlikely to be added.
